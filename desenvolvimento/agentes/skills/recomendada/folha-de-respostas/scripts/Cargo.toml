[package]
name = "gerar-folha"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[lints.clippy]
# E1, regra 20 da constituição: nenhum nome de uma letra; só `_` (lista vazia em clippy.toml).
min_ident_chars = "deny"
