<!doctype html>
<!-- Protótipo mínimo para testar o tirar-prints: responde a ?listarPrints=<rotina> como o
     template (um <pre id="lista-de-prints"> com o JSON) e monta cada combinação num
     .showcase-body--print, sem nada da internet. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Protótipo mínimo</title>
<style>
body{margin:0;font:16px/1.4 sans-serif}
.moldura{box-sizing:border-box;height:100vh;padding:24px;border:12px solid #C2410C}
.moldura[data-tema="dark"]{background:#131010;color:#F5F0EB;border-color:#FB923C}
.moldura[data-tema="light"]{background:#FAF7F4;color:#1C1917}
.faixa{height:40px;margin-top:16px;background:linear-gradient(90deg,#15803D,#9A3412)}
</style>
</head>
<body>
<div id="raiz"></div>
<script>
const ROTINAS = {
  'turno-do-caixa': [
    { tela: 'abrir', superficie: 'celular', largura: 438, altura: 892 },
    { tela: 'fechar', superficie: 'computador', largura: 1280, altura: 800 },
  ],
  'cadastro': [
    { tela: 'novo', superficie: 'tablet', largura: 868, altura: 1228, opcao: 'Q1:B' },
  ],
  'quebrada': [
    { tela: 'nunca-monta', superficie: 'celular', largura: 438, altura: 892 },
  ],
};
const parametros = new URLSearchParams(location.search);
const raiz = document.getElementById('raiz');
const listar = parametros.get('listarPrints');
if (listar !== null) {
  const nomes = listar === 'todas' ? Object.keys(ROTINAS).filter((nome) => nome !== 'quebrada') : [listar].filter((nome) => ROTINAS[nome]);
  const prints = [];
  for (const nome of nomes) {
    ROTINAS[nome].forEach((item, indice) => {
      for (const tema of ['light', 'dark']) {
        const pasta = item.opcao ? `opcao-${item.opcao.replace(':', '-')}/` : '';
        const busca = new URLSearchParams({ visao: nome, superficie: item.superficie, tema, estado: 'default', print: '1' });
        if (item.opcao) busca.set('opcao', item.opcao);
        prints.push({
          arquivo: `${nome}/${pasta}${String(indice + 1).padStart(2, '0')}-${item.tela}--${item.superficie}--${tema}--default.png`,
          endereco: `?${busca.toString()}#/${item.tela}`,
          largura: item.largura,
          altura: item.altura,
        });
      }
    });
  }
  const lista = document.createElement('pre');
  lista.id = 'lista-de-prints';
  setTimeout(() => { lista.textContent = JSON.stringify(prints, null, 2); raiz.append(lista); }, 200);
} else if (location.hash !== '#/nunca-monta') {
  setTimeout(() => {
    const palco = document.createElement('main');
    palco.className = 'showcase-body showcase-body--print';
    const moldura = document.createElement('div');
    moldura.className = 'moldura';
    moldura.dataset.tema = parametros.get('tema');
    moldura.innerHTML = '<h1></h1><p></p><div class="faixa"></div>';
    moldura.querySelector('h1').textContent = location.hash + ' · ' + parametros.get('superficie');
    moldura.querySelector('p').textContent = 'idioma=' + parametros.get('idioma') + ' opcao=' + parametros.get('opcao') + ' janela=' + innerWidth + 'x' + innerHeight;
    palco.append(moldura);
    raiz.append(palco);
  }, 300);
}
</script>
</body>
</html>
