# Watchdog de CI do método StackLabs: vale para humanos e agentes, em toda PR.
# Regras: AGENTS.md · Detalhes: docs/agents/watchdogs.md
# Torne este check obrigatório na proteção da main quando o plano do GitHub permitir.
name: vigia-do-metodo

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const nomeBranch = pr.head.ref;
            const problemas = [];

            // Adoção do método num projeto existente: etapa e data em .claude/metodo.json da base.
            let metodoDoProjeto = { etapaDeAdocao: "completo", adotadoEm: null };
            try {
              const { data: arquivoMetodo } = await github.rest.repos.getContent({ ...context.repo, path: ".claude/metodo.json", ref: pr.base.ref });
              metodoDoProjeto = { ...metodoDoProjeto, ...JSON.parse(Buffer.from(arquivoMetodo.content, "base64").toString("utf8")) };
            } catch { /* sem o arquivo: o projeto nasceu no método */ }
            const prAnteriorAAdocao = metodoDoProjeto.adotadoEm && new Date(pr.created_at) < new Date(metodoDoProjeto.adotadoEm);

            // 1. Branch do método (PR aberta antes da adoção fica de fora até o merge).
            if (!prAnteriorAAdocao) {
              const prefixosValidos = ["issue/", "integracao/", "prototype/", "chore/"];
              if (nomeBranch.startsWith("research/")) {
                problemas.push("branch research/* nunca entra na main: a pesquisa fica na branch, apontada pelo ticket.");
              } else if (!prefixosValidos.some((prefixo) => nomeBranch.startsWith(prefixo))) {
                problemas.push(`a branch "${nomeBranch}" não segue o método: use issue/<n>-<slug>, integracao/<nome>, prototype/<nome> ou chore/<nome>.`);
              }

              // 2. PR de implementação nasce de uma fatia vertical.
              const numeroDaBranch = nomeBranch.match(/^issue\/(\d+)-/);
              if (numeroDaBranch) {
                const numeroIssue = Number(numeroDaBranch[1]);
                const corpoPr = pr.body || "";
                if (!new RegExp(`\\b(closes|fixes|resolves)\\s+#${numeroIssue}\\b`, "i").test(corpoPr)) {
                  problemas.push(`o corpo da PR não fecha a issue da branch: acrescente "Closes #${numeroIssue}".`);
                }
                try {
                  const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: numeroIssue });
                  const labels = issue.labels.map((label) => (typeof label === "string" ? label : label.name));
                  if (labels.some((label) => label.startsWith("wayfinder:"))) {
                    problemas.push(`#${numeroIssue} é ticket do wayfinder: decide, não implementa.`);
                  }
                  if (!labels.some((label) => ["ready-for-agent", "ready-for-human"].includes(label))) {
                    problemas.push(`#${numeroIssue} não tem ready-for-agent nem ready-for-human: passe por /to-tickets ou /triage.`);
                  }
                } catch {
                  problemas.push(`a issue #${numeroIssue} da branch não existe neste repositório.`);
                }
              }
            }

            // 3. Watchdogs só mudam com aval: a label, aplicada por uma pessoa ou pelo --concluir-pr do
            // setup-stacklabs depois de conferir os arquivos com a fonte oficial (ADR 0024).
            const arquivosAlterados = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: pr.number });
            const caminhosDosWatchdogs = /^(\.claude\/(watchdogs|githooks|agents)\/|\.claude\/(settings|metodo)\.json$|\.github\/workflows\/vigia-do-metodo\.yml$)/;
            const alteraWatchdogs = arquivosAlterados.some((arquivo) => caminhosDosWatchdogs.test(arquivo.filename));
            const temAvalHumano = pr.labels.some((label) => label.name === "altera-watchdogs");
            const problemasDosWatchdogs = alteraWatchdogs && !temAvalHumano
              ? ["a PR altera os watchdogs. Atualização do método: rode o --concluir-pr do setup-stacklabs. Outra mudança: um humano revisa e aplica a label altera-watchdogs."]
              : [];

            // Em observação, as regras do método só avisam; mudar os watchdogs exige aval em qualquer etapa.
            const problemasQueReprovam = metodoDoProjeto.etapaDeAdocao === "observacao" ? problemasDosWatchdogs : [...problemas, ...problemasDosWatchdogs];
            const problemasSoAvisados = metodoDoProjeto.etapaDeAdocao === "observacao" ? problemas : [];
            if (problemasSoAvisados.length) core.warning(`Método StackLabs (etapa de observação, só aviso):\n- ${problemasSoAvisados.join("\n- ")}`);
            if (problemasQueReprovam.length) {
              core.setFailed(`Método StackLabs:\n- ${problemasQueReprovam.join("\n- ")}`);
            } else {
              core.info(prAnteriorAAdocao ? "PR anterior à adoção do método: fora das regras de branch e de issue."
                : problemasSoAvisados.length ? "Passou com avisos: na etapa de observação, as regras do método não reprovam." : "PR segue o método.");
            }
