id: teste-sem-afirmacao-rust
language: Rust
message: "P5: teste sem afirmação passa sem conferir nada. Afirme o que o risco muda (RK<n>) ou apague o teste."
severity: error
rule:
  kind: function_item
  all:
    - follows:
        stopBy: { not: { any: [ { kind: attribute_item }, { kind: line_comment } ] } }
        kind: attribute_item
        regex: '^#\[(\w+::)*test\]$'
    - not:
        follows:
          stopBy: { not: { any: [ { kind: attribute_item }, { kind: line_comment } ] } }
          kind: attribute_item
          regex: '^#\[should_panic'
    - not:
        has:
          stopBy: end
          kind: macro_invocation
          regex: '^(\w+::)*(assert|debug_assert|prop_assert|conferir)\w*!'
    - not:
        has:
          stopBy: end
          kind: identifier
          regex: '^(assert|verify|expect|conferir)'

---
id: teste-sem-afirmacao-java
language: Java
message: "P5: teste sem afirmação passa sem conferir nada. Afirme o que o risco muda (RK<n>) ou apague o teste."
severity: error
rule:
  kind: method_declaration
  all:
    - has: { kind: modifiers, has: { regex: '^@(Test|ParameterizedTest|RepeatedTest|TestFactory|TestTemplate)\b' } }
    - not:
        has:
          field: body
          has:
            stopBy: end
            kind: identifier
            regex: '^(assert|verify|expect|fail|conferir)'

