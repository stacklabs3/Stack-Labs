# Princípio P5 (regra 15 da constituição): todo teste falha quando o risco que ele cobre acontece. Teste
# sem afirmação só falha se o código lançar erro: passa com qualquer resultado (o "Unknown Test" do
# tsDetect). Copie para docs/regras-de-codigo/ast-grep/ e aponte `arquivos` para os testes; apague os
# documentos das linguagens que o projeto não usa. Conta como afirmação qualquer chamada cujo nome
# começa por expect, assert, verify ou conferir (o auxiliar de afirmação do projeto segue esse nome),
# os macros assert*! do Rust e o #[should_panic]. Sem marcador a trocar.
id: teste-sem-afirmacao
language: TypeScript
message: "P5: teste sem afirmação passa sem conferir nada. Afirme o que o risco muda (RK<n>) ou apague o teste."
severity: error
rule:
  kind: call_expression
  all:
    - has: { field: function, regex: '^(it|test)\b' }
    - has: { field: arguments, has: { any: [ { kind: arrow_function }, { kind: function_expression } ] } }
    - not:
        has:
          stopBy: end
          kind: identifier
          regex: '^(expect|assert|verify|conferir)'
