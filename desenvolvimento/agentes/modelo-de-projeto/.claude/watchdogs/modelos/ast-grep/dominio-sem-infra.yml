# Princípios D e P3: o domínio não importa infraestrutura. Copie para docs/regras-de-codigo/ast-grep/
# e troque os marcadores: <PASTA_DO_DOMINIO> e <PACOTES_DE_INFRA> (regex). Exemplos por linguagem:
#   TS/JS/Python: src/dominio · prisma|@prisma/|express|axios|pg
#   Java: src/main/java/br/com/loja/dominio · org\.springframework|jakarta\.persistence|org\.hibernate|
#         com\.fasterxml\.jackson|java\.sql|software\.amazon (pontos escapados)
#   Rust: src/dominio · sqlx|reqwest|tokio|aws_sdk_s3|crate::infra (nome do crate no código: hífen vira _)
# Um documento por linguagem; apague os que o projeto não usa e, para outra linguagem, copie um
# documento e troque `language` e o `kind` do import dela.
id: dominio-sem-infra
language: TypeScript
message: "D/P3: o domínio importa infraestrutura. Defina a port no domínio; o adapter vive fora."
severity: error
files: ["<PASTA_DO_DOMINIO>/**"]
rule:
  kind: string_fragment
  regex: ^(<PACOTES_DE_INFRA>)
  any:
    - inside: { kind: import_statement, stopBy: end }
    - inside: { kind: export_statement, stopBy: end }
    - inside: { pattern: require($$$), stopBy: end }
    - inside: { pattern: import($$$), stopBy: end }

