# Princípio E4: erro nunca é engolido. Copie para docs/regras-de-codigo/ast-grep/. Pega o catch vazio
# e o catch que só loga e segue. Um documento por linguagem (TypeScript, Tsx, JavaScript, Python, Java,
# Rust); apague os que o projeto não usa. Sem marcador a trocar, exceto o nome do logger no documento
# Java (`log|logger|LOG|LOGGER` na regex), se o projeto usa outro.
id: catch-vazio
language: TypeScript
message: "E4: o erro é engolido. Trate o caso esperado ou deixe o erro subir até a borda."
severity: error
rule:
  any:
    - pattern: try { $$$ } catch ($E) { }
    - pattern: try { $$$ } catch { }
    - pattern: try { $$$ } catch ($E) { console.$LOG($$$) }

