# Rust: o macro guarda os argumentos como tokens. O padrão pega o mesmo nome dos dois lados e a regex,
# literal contra literal; expressão longa repetida dos dois lados fica com o revisor.
id: afirmacao-trivial-rust
language: Rust
message: "P5: a afirmação compara um valor com ele mesmo ou confere uma constante: passa sempre. O esperado vem de um exemplo do risco (RK<n>), e o obtido, do código."
severity: error
rule:
  kind: macro_invocation
  any:
    - pattern: assert!(true)
    - pattern: debug_assert!(true)
    - pattern: assert_eq!($VALOR, $VALOR)
    - pattern: assert_ne!($VALOR, $VALOR)
    - regex: '^(\w+::)*(debug_)?assert_(eq|ne)!\(\s*(-?[\d.]+|"[^"]*"|true|false)\s*,\s*(-?[\d.]+|"[^"]*"|true|false)\s*(,|\))'

---
id: afirmacao-trivial-java
language: Java
message: "P5: a afirmação compara um valor com ele mesmo ou confere uma constante: passa sempre. O esperado vem de um exemplo do risco (RK<n>), e o obtido, do código."
severity: error
constraints:
  CONSTANTE: { any: [ { kind: decimal_integer_literal }, { kind: string_literal }, { kind: 'true' }, { kind: 'false' }, { kind: null_literal } ] }
rule:
  any:
    - pattern: assertTrue($CONSTANTE)
    - pattern: assertFalse($CONSTANTE)
    - pattern: assertEquals($VALOR, $VALOR)
    - pattern: assertSame($VALOR, $VALOR)
    - pattern: assertThat($CONSTANTE)
    - pattern: assertThat($VALOR).$MATCHER($VALOR)
