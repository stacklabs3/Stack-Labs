# Princípio P5 (regra 15 da constituição): o esperado vem de uma fonte independente do código (um
# exemplo do risco, um literal conhecido) e o obtido vem do código. Afirmação que compara um valor com
# ele mesmo, ou que confere uma constante, passa por construção (o "Redundant Assertion" do tsDetect).
# A tautologia que recalcula o esperado como o código calcula não tem forma fixa: fica com o revisor.
# Copie para docs/regras-de-codigo/ast-grep/ e aponte `arquivos` para os testes; apague os documentos
# das linguagens que o projeto não usa. Sem marcador a trocar.
id: afirmacao-trivial
language: TypeScript
message: "P5: a afirmação compara um valor com ele mesmo ou confere uma constante: passa sempre. O esperado vem de um exemplo do risco (RK<n>), e o obtido, do código."
severity: error
constraints:
  CONSTANTE: { any: [ { kind: number }, { kind: string }, { kind: 'true' }, { kind: 'false' }, { kind: 'null' }, { kind: undefined } ] }
  VALOR: { not: { any: [ { kind: number }, { kind: string }, { kind: 'true' }, { kind: 'false' }, { kind: 'null' }, { kind: undefined } ] } }
rule:
  any:
    - pattern: expect($CONSTANTE)
    - pattern: expect($VALOR).$MATCHER($VALOR)
    - pattern: assert($CONSTANTE)
    - pattern: assert.$METODO($CONSTANTE)
    - pattern: assert.$METODO($VALOR, $VALOR)
