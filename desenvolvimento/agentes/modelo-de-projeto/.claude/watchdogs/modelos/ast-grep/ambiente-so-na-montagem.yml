# Princípio P3: configuração por ambiente se lê num ponto só, a montagem. Copie para
# docs/regras-de-codigo/ast-grep/ e troque <ARQUIVOS_DA_MONTAGEM> (ex.: src/montagem/**). Um
# documento por linguagem; apague os que o projeto não usa.
id: ambiente-so-na-montagem
language: TypeScript
message: "P3: leitura de ambiente fora da montagem. Receba o valor por parâmetro."
severity: error
ignores: ["<ARQUIVOS_DA_MONTAGEM>"]
rule:
  pattern: process.env

